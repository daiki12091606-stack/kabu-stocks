name: update-stocks

on:
  workflow_dispatch:        # 手動実行（テスト用）
  schedule:
    # GitHub の cron は UTC。日本時間(JST=UTC+9)の各通知の少し前に実行する。
    # Actionsは数分遅延しうるので余裕をもって設定。
    - cron: "45 20 * * 0-4"   # JST 平日 朝 5:45 ごろ（朝6:10通知の前）
    - cron: "35 2  * * 1-5"   # JST 平日 昼 11:35 ごろ（昼11:50通知の前）
    - cron: "45 6  * * 1-5"   # JST 平日 夕 15:45 ごろ（夕16:07通知の前）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch stocks
        run: python fetch_stocks.py
      - name: Commit stocks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks.json
          git diff --staged --quiet || git commit -m "update stocks.json [auto]"
          git push
