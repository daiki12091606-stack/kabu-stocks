name: update-stocks


on:
  workflow_dispatch:
  schedule:
    # データ更新のみ（Discord通知は廃止＝朝レポートはアプリ4:17に一本化）。
    # stocks.json を1日数回更新し、アプリの朝レポートが読み込む。
    - cron: "0 20 * * 0-4"→ Runs at 20:00, Sunday through Thursday    # JST 朝 5:00
    - cron: "30 20 * * 0-4"→ Runs at 20:30, Sunday through Thursday   # JST 朝 5:30
    - cron: "35 2 * * 1-5"→ Runs at 02:35, Monday through Friday    # JST 昼 11:35
    - cron: "0 3 * * 1-5"→ Runs at 03:00, Monday through Friday     # JST 昼 12:00
    - cron: "0 8 * * 1-5"→ Runs at 08:00, Monday through Friday     # JST 夜 17:00
    - cron: "30 8 * * 1-5"→ Runs at 08:30, Monday through Friday    # JST 夜 17:30


permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch stocks
        run: python fetch_stocks.py
      - name: Notify Discord
  env:
    DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  run: python notify_discord.py
- name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks.json sectors.json daily_log.csv
          git diff --staged --quiet || git commit -m "update data [auto]"
          git push
