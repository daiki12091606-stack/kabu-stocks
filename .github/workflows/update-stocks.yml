name: update-stocks

on:
  workflow_dispatch:
  schedule:
    - cron: "45 20 * * 0-4"   # JST 平日 朝 5:45
    - cron: "35 2  * * 1-5"   # JST 平日 昼 11:35
    - cron: "45 6  * * 1-5"   # JST 平日 夕 15:45

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch stocks
        run: python fetch_stocks.py
      - name: Notify Discord (判断支援)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
        run: python notify_discord.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks.json sectors.json
          git diff --staged --quiet || git commit -m "update data [auto]"
          git push
