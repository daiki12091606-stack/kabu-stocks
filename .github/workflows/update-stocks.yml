name: update-stocks

on:
  workflow_dispatch:
  schedule:
    # 各時間帯を「本番＋予備」の2回スケジュール（cron取りこぼし対策）。
    # 同じ日・同じ時間帯はnotify側の重複ガードで2通目をスキップするため、両方走っても1通だけ届く。
    - cron: "0 20 * * 0-4"    # JST 朝 5:00（本番）
    - cron: "30 20 * * 0-4"   # JST 朝 5:30（予備）
    - cron: "35 2 * * 1-5"    # JST 昼 11:35（本番）
    - cron: "0 3 * * 1-5"     # JST 昼 12:00（予備）
    - cron: "0 8 * * 1-5"     # JST 夜 17:00（本番）
    - cron: "30 8 * * 1-5"    # JST 夜 17:30（予備）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch stocks
        run: python fetch_stocks.py
      - name: Notify Discord (判断支援)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
        run: python notify_discord.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks.json sectors.json daily_log.csv
          git diff --staged --quiet || git commit -m "update data [auto]"
          git push
